name: webapk
on:
  push:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: cd webapp && gradle assembleDebug --no-daemon --stacktrace
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.run_number }}
          name: 待一会 WebAPK ${{ github.run_number }}
          files: webapp/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
