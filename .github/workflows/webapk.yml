name: webapk
on:
  push:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: cd webapp && gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to branch
        run: |
          mkdir -p apk-latest
          cp webapp/app/build/outputs/apk/debug/app-debug.apk apk-latest/app-debug.apk
          git config user.name ci
          git config user.email ci@example.com
          git add apk-latest/app-debug.apk
          git commit -m "apk ${GITHUB_RUN_NUMBER} [skip ci]" || true
          git push -f origin HEAD:apk-bin
